<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>D.I.S.P. – Dispatcher Intelligent Support Platform</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7fc;
      color: #222;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #003366;
      padding: 20px 40px;
      color: white;
    }

    header img {
      height: 50px;
    }

    nav button {
      margin-left: 20px;
      padding: 10px 18px;
      border: none;
      border-radius: 5px;
      background-color: #ffffff;
      color: #003366;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    nav button:hover {
      background-color: #e0e0e0;
    }

    main {
      text-align: center;
      margin-top: 100px;
      padding: 0 40px;
    }

    main h1 {
      font-size: 42px;
      color: #003366;
    }

    main p {
      font-size: 20px;
      max-width: 700px;
      margin: 20px auto;
    }
  </style>
</head>
<body>

  <header>
    <img src="{{ url_for('static', filename='logo.png') }}" alt="D.I.S.P. Logo" />
    <nav>
      <button onclick="window.location.href='mailto:Simeon.genkov@a7tradelogistics.de'">Contact Us</button>
      <button onclick="window.location.href='/login'">Login</button>
    </nav>
  </header>

  <main>
    <h1>Welcome to D.I.S.P.</h1>
    <p>
      The Dispatcher Intelligent Support Platform (D.I.S.P.) provides real-time performance analysis,
      automated scorecard reports, and smart tools to support decision-making in modern logistics operations.
    </p>
  </main>

</body>
</html>
