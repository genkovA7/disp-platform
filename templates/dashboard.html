<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Dashboard – D.I.S.P.</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #003366, #0066cc);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }
        p {
            font-size: 22px;
            margin-bottom: 30px;
        }
        .button {
            padding: 15px 30px;
            border-radius: 50px;
            background-color: #ffffff;
            color: #003366;
            font-weight: bold;
            font-size: 18px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }
        .button:hover {
            background-color: #003366;
            color: white;
            transform: translateY(-4px);
            box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <h1>Welcome to your Dashboard</h1>
    <p>You are logged in successfully! This is your control panel.</p>
    <button class="button" onclick="window.location.href='/logout'">Logout</button>

</body>
</html>
