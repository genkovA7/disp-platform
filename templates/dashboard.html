<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard – D.I.S.P.</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #003366, #0066cc);
      color: white;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      height: 100vh;
      padding: 30px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 20px;
      text-align: center;
    }

    .section {
      margin-bottom: 40px;
      padding: 30px;
      background-color: rgba(0, 0, 0, 0.6);
      border-radius: 10px;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 800px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .section:hover {
      transform: scale(1.05);
      box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.5);
    }

    .section h2 {
      font-size: 30px;
      margin-bottom: 20px;
    }

    .section button, .section select {
      padding: 15px 30px;
      margin: 10px;
      border-radius: 50px;
      background-color: #ffffff;
      color: #003366;
      font-weight: bold;
      font-size: 18px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease-in-out;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
    }

    .section button:hover, .section select:hover {
      background-color: #003366;
      color: white;
      transform: translateY(-4px);
      box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.3);
    }

    .section select {
      font-size: 18px;
      background-color: rgba(255, 255, 255, 0.2);
    }

    footer {
      margin-top: 50px;
      background-color: #1d1f27;
      padding: 20px;
      color: white;
      width: 100%;
      text-align: center;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <h1>Welcome to Your Dashboard</h1>
  <p>You are logged in successfully! Here's your control panel.</p>

  <!-- Section for uploading a scorecard -->
  <div class="section">
    <h2>Upload a New Scorecard</h2>
    <button onclick="window.location.href='/upload-scorecard'">Upload Scorecard</button>
  </div>

  <!-- Section for viewing past scorecards -->
  <div class="section">
    <h2>View Past Scorecards</h2>
    <button onclick="window.location.href='/view-scorecards'">View Old Scorecards</button>
  </div>

  <!-- Section for selecting week and reviewing -->
  <div class="section">
    <h2>Select Week for Review</h2>
    <select>
      <option value="week1">Week 1</option>
      <option value="week2">Week 2</option>
      <option value="week3">Week 3</option>
      <!-- These options can be dynamically populated based on uploaded scorecards -->
    </select>
    <button onclick="window.location.href='/review-week'">Review Selected Week</button>
  </div>

  <!-- Section for top 5 worst performers -->
  <div class="section">
    <h2>Top 5 Worst Performers</h2>
    <button onclick="window.location.href='/top-5'">View Top 5 Worst Performers</button>
  </div>

  <footer>
    <p>&copy; 2025 D.I.S.P. - Dispatcher Intelligent Support Platform | All Rights Reserved</p>
  </footer>

</body>
</html>
